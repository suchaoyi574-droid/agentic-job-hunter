[project]
name = "agentic-job-hunter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "browser-use>=0.13.10",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp[cli]>=2.1.1",
    "pydantic>=2.13.5",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
agentic-job-hunter = "agentic_job_hunter:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
